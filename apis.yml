description: Novamab (洛启生物) is a Shanghai-based clinical-stage biopharmaceutical company
  specializing in VHH (nanobody) antibody drug development for respiratory and inflammatory
  diseases such as asthma, COPD, and IBD. Its platforms span inhaled antibodies, oral
  antibodies, and dual/multi-specific antibodies alongside integrated drug formulation
  and manufacturing. Surfaced as a portfolio company of qiming and added to the API
  Evangelist network as a stub; enrichment confirmed the company publishes a corporate
  website but no developer API, documentation portal, SDKs, or other machine-readable
  API surface.
